# PURPOSE: credential / API-key patterns. All findings are type SECRET (policy: block_with_rewrite).
patterns:
  - {id: aws_access_key, type: SECRET, regex: '\bAKIA[0-9A-Z]{16}\b', severity: critical, message: "AWS access key"}
  - {id: private_key, type: SECRET, regex: '-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----', severity: critical, message: "private key"}
  - {id: jwt, type: SECRET, regex: '\beyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\b', severity: critical, message: "JWT"}
  - {id: github_token, type: SECRET, regex: '\bgh[pousr]_[A-Za-z0-9]{30,}\b', severity: critical, message: "GitHub token"}
  - {id: slack_token, type: SECRET, regex: '\bxox[abprs]-[A-Za-z0-9-]{10,}\b', severity: critical, message: "Slack token"}
  - {id: sk_key, type: SECRET, regex: '\bsk-[A-Za-z0-9_-]{20,}\b', severity: critical, message: "API secret key"}
  - {id: password_assign, type: SECRET, regex: '(?i)\b(?:password|passwd|pwd|secret|api[_-]?key|token)\s*[:=]\s*\S{6,}', severity: high, message: "credential assignment"}
